steps:

  # Build Docker image tagged with commit SHA

  - name: 'gcr.io/cloud-builders/docker'

    args:

      [

        'build',

        '-t',

        'asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest',

        '.'

      ]
 
  # Push image to Artifact Registry

  - name: 'gcr.io/cloud-builders/docker'

    args:

      [

        'push',

        'asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest'

      ]
 
  # Deploy without traffic, configure Cloud Run to listen on port 8080

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'

    id: Deploy-No-Traffic

    entrypoint: gcloud

    args:

      [

        'run',

        'deploy',

        'thamizh-backend',

        '--image',

        'asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest',

        '--platform',

        'managed',

        '--region',

        'asia-south1',

        '--allow-unauthenticated',

        '--port=8080',

        '--no-traffic'

      ]
 
  # Smoke test the new deployment (check root path)

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'

    id: Smoke-Test

    entrypoint: bash

    args:

      - -c

      - |

        NEW_URL=$(gcloud run services describe thamizh-backend --region=asia-south1 --format='value(status.url)')

        echo "Testing $$NEW_URL/"

        curl -f "$$NEW_URL/" || { echo "Smoke test failed"; exit 1; }
 
  # Shift all traffic to the new revision

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'

    id: Shift-Traffic

    entrypoint: gcloud

    args:

      [

        'run',

        'services',

        'update-traffic',

        'thamizh-backend',

        '--to-latest',

        '--region=asia-south1'

      ]
 
options:

  logging: CLOUD_LOGGING_ONLY
 