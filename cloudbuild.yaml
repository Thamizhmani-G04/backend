steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t',
        'asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest',
        '.'
      ]

  # Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest'
      ]

  # Deploy with conditional --no-traffic
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Deploy
    entrypoint: bash
    args:
      - -c
      - |-
        if gcloud run services describe thamizh-backend --region=asia-south1 > /dev/null 2>&1; then
          echo "Service exists, deploying with --no-traffic"
          gcloud run deploy thamizh-backend \
            --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest \
            --platform=managed \
            --region=asia-south1 \
            --vpc-connector=my-connector \
            --set-env-vars="INSTANCE_CONNECTION_NAME=striped-proxy-462506-j3:asia-south1:my-postgres-instance" \
            --allow-unauthenticated \
            --service-account=testing04@striped-proxy-462506-j3.iam.gserviceaccount.com \
            --port=8080 \
            --no-traffic
        else
          echo "Service does not exist, deploying without --no-traffic"
          gcloud run deploy thamizh-backend \
            --image=asia-south1-docker.pkg.dev/${PROJECT_ID}/thamizh-repository/backend:latest \
            --platform=managed \
            --region=asia-south1 \
            --vpc-connector=my-connector \
            --allow-unauthenticated \
            --service-account=testing04@striped-proxy-462506-j3.iam.gserviceaccount.com \
            --set-env-vars="INSTANCE_CONNECTION_NAME=striped-proxy-462506-j3:asia-south1:my-postgres-instance" \
            --port=8080
        fi

  # Smoke test the new deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Smoke-Test
    entrypoint: bash
    args:
      - -c
      - |-
        NEW_URL=$(gcloud run services describe thamizh-backend --region=asia-south1 --format='value(status.url)')
        echo "Testing $$NEW_URL/healthCheck"
        curl -f "$$NEW_URL/healthCheck" || { echo "Smoke test failed"; exit 1; }

  # Shift all traffic to the new revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: Shift-Traffic
    entrypoint: gcloud
    args:
      [
        'run',
        'services',
        'update-traffic',
        'thamizh-backend',
        '--to-latest',
        '--region=asia-south1'
      ]

options:
  logging: CLOUD_LOGGING_ONLY
